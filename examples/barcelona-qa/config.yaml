# Worked example: Senior QA Automation / AI QA engineer based in Barcelona.
# Company lists and job feeds verified 29 September 2026. Companies change ATS, so re-audit every quarter.
# Copy to the skill root as config.yaml and adapt.

candidate:
  cv_file: my_cv.docx
  positioning: Senior QA Automation Engineer and AI QA specialist (8+ years, ISTQB CTFL and CT-AI)
  secondary_strengths:
  - 'UX research: user-centred testing, collaboration with Design and Product'
  languages:
  - name: English
    level: C1
  - name: Spanish
    level: B2
  - name: Russian
    level: Native
  - name: Ukrainian
    level: Native
roles:
  track: QA
  target_types:
  - QA / Test Automation Engineer
  - SDET
  - QA Manual (senior)
  - AI / ML / LLM testing and evaluation
  reject_types:
  - UX Research
  - Customer Success
  - Account Management
  - Project Management
  - Contact-centre QA
  - Sales QA
  - Pure data science
  - Non-software QA/QC (manufacturing, construction)
  title_sets:
    A:
      titles:
      - QA Engineer
      - Quality Engineer
      - QA Automation
      - SDET
    B:
      titles:
      - Test Engineer
      - Test Automation
      - Automation Engineer
      - Quality Assurance
    C:
      titles:
      - AI QA
      - AI Test Engineer
      - LLM Evaluation
      - AI Quality Engineer
      daily: true
      reject_if: ML or data-science roles with no testing or evaluation responsibility
seniority:
  accept:
  - Senior (5+ years)
  - Mid-level titled plainly 'QA Engineer' / 'Automation Engineer' if it meets the salary floor
  hard_skip:
  - Entry level (0–2 years)
  query_exclusions: -junior -intern -graduate -trainee -principal -director -head
locations:
  default_scope: barcelona
  other_scopes:
  - spain
  - emea
  - worldwide_remote
  - relocation
  work_models:
  - remote
  - hybrid
  scopes:
    barcelona:
      label: Barcelona
      terms:
      - Barcelona
      - Remote Spain
      - Remote Europe
    spain:
      label: Spain
      terms:
      - Spain
      - Madrid
      - Valencia
      - Remote Spain
    emea:
      label: EMEA remote
      terms:
      - Remote EMEA
      - Remote Europe
      - Europe hybrid
    worldwide_remote:
      label: Worldwide remote
      terms:
      - Remote
    relocation:
      label: Worldwide relocation
      terms:
      - relocation
  relocation:
    work_authorisation:
    - EU
    visa_sponsorship_required_outside_authorisation: true
    cities:
    - 'Europe: any city'
    - 'UK: London, Bristol'
    - 'Ireland: Dublin'
    - 'USA: any big city'
    - 'Asia: Tokyo, Osaka, Hong Kong, Singapore, Seoul'
    - 'UAE: Dubai, Abu Dhabi'
    - 'Australia: Sydney, Melbourne, Brisbane, Perth'
salary:
  currency: EUR
  global_floor: 55000
  city_floors:
    Barcelona / Spain: EUR 55,000
    Other European cities: EUR 55,000
    London: GBP 75,000
    Bristol: GBP 60,000
    Dublin: EUR 65,000
    New York: USD 105,000
    Los Angeles: USD 95,000
    Other big US cities: USD 95,000
    Dubai / Abu Dhabi: AED 240,000 (tax-free)
    Sydney / Melbourne: AUD 100,000
